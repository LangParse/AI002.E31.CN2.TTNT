[project]
name = "ai-medication-reminder"
version = "0.1.0"
description = "AI-powered medication reminder system with contextual bandits and fairness analysis"
readme = "README.md"
requires-python = ">=3.8"
authors = [
  { name = "AI Medication Reminder Team", email = "team@ai-medication-reminder.com" },
]
keywords = [
  "ai",
  "medication",
  "reminder",
  "contextual-bandit",
  "machine-learning",
  "healthcare",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
  "pandas>=1.3.0",
  "numpy>=1.21.0",
  "scikit-learn>=1.0.0",
  "matplotlib>=3.4.0",
  "seaborn>=0.11.0",
  "jupyter>=1.0.0",
  "ipykernel>=6.0.0",
]

[project.optional-dependencies]
torch = ["torch>=1.9.0", "torchvision>=0.10.0"]
dev = [
  "pytest>=6.0.0",
  "pytest-cov>=2.12.0",
  "black>=21.0.0",
  "flake8>=3.9.0",
  "mypy>=0.910",
  "pre-commit>=2.15.0",
]
all = ["ai-medication-reminder[torch,dev]"]

[project.urls]
Homepage = "https://github.com/ai-medication-reminder/ai-medication-reminder"
Repository = "https://github.com/ai-medication-reminder/ai-medication-reminder"
Documentation = "https://ai-medication-reminder.readthedocs.io"
"Bug Tracker" = "https://github.com/ai-medication-reminder/ai-medication-reminder/issues"

[project.scripts]
ai-medication-reminder = "main:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--cov=src", "--cov-report=html", "--cov-report=term-missing"]
